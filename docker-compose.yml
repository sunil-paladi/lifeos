services:
  postgres:
    image: postgres:17-alpine
    container_name: lifeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev_password
      POSTGRES_DB: lifeos
    ports:
      - "5432:5432"
    volumes:
      - lifeos-postgres-data:/var/lib/postgresql/data

  app:
    image: lifeos:latest
    container_name: lifeos-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lifeos:lifeos_dev_password@postgres:5432/lifeos
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - "3000:3000"

volumes:
  lifeos-postgres-data:
    external: true
